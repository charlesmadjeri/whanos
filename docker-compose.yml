services:
  docker-dind:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    environment:
      # TLS off for the *internal* compose network only — do not publish 2375.
      - DOCKER_TLS_CERTDIR=""
    # No host ports: DinD is reachable only as docker-dind:2375 on whanos-network.
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - whanos-network

  jenkins:
    build:
      context: .
      dockerfile: ./jenkins/Dockerfile
    env_file:
      - ./jenkins/.env
    restart: unless-stopped
    ports:
      - 8080:8080
      - 50000:50000
    environment:
      - DOCKER_HOST=tcp://docker-dind:2375
    depends_on:
      - docker-dind
    volumes:
      - jenkins-data:/var/lib/jenkins
      # Do not mount the host docker.sock — Jenkins must use DinD only.
      - ./kubeconfig.yaml:/var/lib/jenkins/kube/config:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - whanos-network

networks:
  whanos-network:
    driver: bridge

volumes:
  jenkins-data:
