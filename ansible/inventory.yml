all:
  hosts:
    whanos:
      ansible_host: "{{ vps_ip }}"
      ansible_user: root
      ansible_become: yes
      # empty string must omit (default(omit) alone keeps ""), else Ansible forces password auth
      ansible_ssh_private_key_file: "{{ vps_ssh_private_key_file | default(omit, true) }}"
      ansible_password: "{{ vps_root_password | default(omit, true) }}"
