all:
  hosts:
    whanos:
      ansible_host: "{{ vps_ip }}"
      ansible_user: root
      ansible_become: yes
      ansible_ssh_private_key_file: "{{ vps_ssh_private_key_file }}"
      # Password auth only when explicitly set (empty "" must not be passed — it forces password mode).
      ansible_password: "{{ vps_root_password if (vps_root_password | default('') | length) else omit }}"
