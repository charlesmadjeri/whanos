---
- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Reset UFW
  ufw:
    state: reset

- name: Allow SSH
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: 443
    proto: tcp

- name: Deny HTTP
  ufw:
    rule: deny
    port: 80
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny 