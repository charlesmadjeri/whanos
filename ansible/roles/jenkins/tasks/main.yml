---
- name: Install apt helpers for Jenkins repo
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Ensure apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Jenkins uses a non-standard suite path (binary/); write the signed-by list
# explicitly instead of apt_key/apt_repository (removed/deprecated on new Debian).
- name: Install Jenkins repository signing key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: "0644"
    force: true

- name: Add Jenkins apt repository
  copy:
    dest: /etc/apt/sources.list.d/jenkins.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/

- name: Install yq
  get_url:
    url: https://github.com/mikefarah/yq/releases/download/v4.35.1/yq_linux_amd64
    dest: /usr/local/bin/yq
    mode: '0755'

- name: Install doctl (DOKS kubeconfig exec auth)
  unarchive:
    src: "https://github.com/digitalocean/doctl/releases/download/v1.120.0/doctl-1.120.0-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    mode: '0755'
    creates: /usr/local/bin/doctl

- name: Install kubectl
  get_url:
    url: https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: '0755'

- name: Download Jenkins plugin manager
  get_url:
    url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.12.11/jenkins-plugin-manager-2.12.11.jar
    dest: /usr/local/bin/jenkins-plugin-manager.jar
    mode: '0755'

# Small droplets (512MB) need swap or Jenkins OOMs during first boot.
- name: Ensure swapfile for Jenkins
  block:
    - name: Create swapfile
      command: fallocate -l 1G /swapfile
      args:
        creates: /swapfile
    - name: Set swapfile permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
    - name: Format swapfile
      command: mkswap /swapfile
      when: ansible_swaptotal_mb | int < 1
    - name: Enable swapfile
      command: swapon /swapfile
      when: ansible_swaptotal_mb | int < 1
    - name: Persist swapfile in fstab
      mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

- name: Prevent Jenkins package from auto-starting
  copy:
    dest: /usr/sbin/policy-rc.d
    mode: "0755"
    content: |
      #!/bin/sh
      exit 101

- name: Install required packages
  apt:
    name:
      - fontconfig
      - openjdk-21-jre
      - jenkins
      - gettext-base  # for envsubst
    state: present
    update_cache: yes

- name: Allow services to start again
  file:
    path: /usr/sbin/policy-rc.d
    state: absent

- name: Stop stock Jenkins if it was started
  systemd:
    name: jenkins
    state: stopped
  failed_when: false

- name: Create Jenkins directories
  file:
    path: "{{ item }}"
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'
  with_items:
    - "{{ jenkins_home }}"
    - "{{ jenkins_home }}/kube"
    - "{{ jenkins_home }}/plugins"
    - "{{ whanos_root }}"
    - "{{ whanos_root }}/jenkins"
    - "{{ whanos_root }}/images"

- name: Ensure Jenkins home directory permissions
  file:
    path: "{{ jenkins_home }}"
    owner: jenkins
    group: jenkins
    recurse: yes
    mode: '0755'
    state: directory

- name: Copy Jenkins files
  copy:
    src: "{{ playbook_dir }}/../jenkins/"
    dest: "{{ whanos_root }}/jenkins/"
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Copy images
  copy:
    src: "{{ playbook_dir }}/../images/"
    dest: "{{ whanos_root }}/images/"
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Copy kubeconfig file
  copy:
    src: "{{ local_kubeconfig_path }}"
    dest: "{{ kubeconfig_path }}"
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Read plugins list
  slurp:
    src: "{{ whanos_root }}/jenkins/plugins.txt"
  register: plugins_content

- name: Check if plugins need to be installed
  stat:
    path: "{{ jenkins_home }}/plugins/{{ item | regex_replace(':.*$','') }}"
  register: jenkins_plugins_check
  with_items: "{{ plugins_content.content | b64decode | split('\n') }}"
  notify: Install Jenkins plugins
  changed_when: not jenkins_plugins_check.stat.exists
  when: item != ""

- name: Configure Jenkins service
  template:
    src: jenkins.service.j2
    dest: /lib/systemd/system/jenkins.service
    mode: '0644'

- name: Ensure /etc/jenkins exists
  file:
    path: /etc/jenkins
    state: directory
    owner: root
    group: jenkins
    mode: '0750'

- name: Install Whanos Jenkins environment file
  template:
    src: whanos.env.j2
    dest: /etc/jenkins/whanos.env
    owner: root
    group: jenkins
    mode: '0640'

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes

- name: Flush handlers before first start (plugins)
  meta: flush_handlers

- name: Start and enable Jenkins service
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Create handlers directory
  file:
    path: "{{ role_path }}/handlers"
    state: directory
    mode: '0755'
