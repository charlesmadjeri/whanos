---
- name: Install apt helpers for Jenkins repo
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Ensure apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Jenkins uses a non-standard suite path (binary/); write the signed-by list
# explicitly instead of apt_key/apt_repository (removed/deprecated on new Debian).
- name: Install Jenkins repository signing key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: "0644"
    force: true

- name: Add Jenkins apt repository
  copy:
    dest: /etc/apt/sources.list.d/jenkins.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/

- name: Install yq
  get_url:
    url: https://github.com/mikefarah/yq/releases/download/v4.35.1/yq_linux_amd64
    dest: /usr/local/bin/yq
    mode: "0755"
    checksum: sha256:bd695a6513f1196aeda17b174a15e9c351843fb1cef5f9be0af170f2dd744f08

- name: Download doctl tarball
  get_url:
    url: https://github.com/digitalocean/doctl/releases/download/v1.120.0/doctl-1.120.0-linux-amd64.tar.gz
    dest: /tmp/doctl-1.120.0-linux-amd64.tar.gz
    mode: "0644"
    checksum: sha256:4d6bddfa2480ff10a7704a26eddf5a9d1c568653fc50cc2eb033522486b9c7cd

- name: Install doctl binary
  unarchive:
    src: /tmp/doctl-1.120.0-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    mode: "0755"
    creates: /usr/local/bin/doctl

- name: Install kubectl
  get_url:
    url: https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"
    checksum: sha256:7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437

- name: Download Jenkins plugin manager
  get_url:
    url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.12.11/jenkins-plugin-manager-2.12.11.jar
    dest: /usr/local/bin/jenkins-plugin-manager.jar
    mode: '0755'

# Small droplets mount /tmp as tmpfs (~half of RAM). Jenkins requires >=1GiB free
# temporary space, so put /tmp + java.io.tmpdir on an attached DO block volume.
- name: Configure DigitalOcean volume for Jenkins temporary space
  when:
    - do_volume_device | default('') | length > 0
    - do_volume_mount | default('') | length > 0
  block:
    - name: Ensure DO volume mount point exists
      file:
        path: "{{ do_volume_mount }}"
        state: directory
        mode: "0755"

    - name: Mount DO volume
      mount:
        path: "{{ do_volume_mount }}"
        src: "{{ do_volume_device }}"
        fstype: ext4
        opts: defaults,nofail,discard
        state: mounted

    - name: Create tmp directories on DO volume
      file:
        path: "{{ item }}"
        state: directory
        mode: "1777"
      loop:
        - "{{ do_volume_mount }}/tmp"
        - "{{ jenkins_tmpdir }}"

    - name: Mask systemd tmp.mount (avoid tmpfs /tmp)
      systemd:
        name: tmp.mount
        masked: true
        state: stopped
      failed_when: false

    - name: Bind-mount volume tmp over /tmp
      mount:
        path: /tmp
        src: "{{ do_volume_mount }}/tmp"
        fstype: none
        opts: bind,nofail
        state: mounted

# Small droplets (512MB) need swap or Jenkins OOMs during first boot.
- name: Ensure swapfile for Jenkins
  block:
    - name: Create swapfile
      command: fallocate -l 1G /swapfile
      args:
        creates: /swapfile
    - name: Set swapfile permissions
      file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
    - name: Format swapfile
      command: mkswap /swapfile
      when: ansible_swaptotal_mb | int < 1
    - name: Enable swapfile
      command: swapon /swapfile
      when: ansible_swaptotal_mb | int < 1
    - name: Persist swapfile in fstab
      mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

- name: Prevent Jenkins package from auto-starting
  copy:
    dest: /usr/sbin/policy-rc.d
    mode: "0755"
    content: |
      #!/bin/sh
      exit 101

- name: Install required packages
  apt:
    name:
      - fontconfig
      - openjdk-21-jre
      - jenkins
      - gettext-base  # for envsubst
    state: present
    update_cache: yes

- name: Allow services to start again
  file:
    path: /usr/sbin/policy-rc.d
    state: absent

- name: Stop stock Jenkins if it was started
  systemd:
    name: jenkins
    state: stopped
  failed_when: false

- name: Create Jenkins directories
  file:
    path: "{{ item }}"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0750"
  with_items:
    - "{{ jenkins_home }}"
    - "{{ jenkins_home }}/kube"
    - "{{ jenkins_home }}/plugins"
    - "{{ whanos_root }}"
    - "{{ whanos_root }}/jenkins"
    - "{{ whanos_root }}/images"

- name: Ensure jenkins owns Jenkins tmpdir on DO volume
  when: jenkins_tmpdir | default('') | length > 0
  file:
    path: "{{ jenkins_tmpdir }}"
    owner: jenkins
    group: jenkins
    mode: "1777"
    state: directory

- name: Ensure Jenkins home ownership (do not chmod secrets world-readable)
  file:
    path: "{{ jenkins_home }}"
    owner: jenkins
    group: jenkins
    recurse: yes
    state: directory

- name: Restrict Jenkins home directory mode
  file:
    path: "{{ jenkins_home }}"
    mode: "0750"
    state: directory

- name: Copy Jenkins files
  copy:
    src: "{{ playbook_dir }}/../jenkins/"
    dest: "{{ whanos_root }}/jenkins/"
    owner: jenkins
    group: jenkins
    directory_mode: "0750"

- name: Ensure Jenkins scripts are executable
  file:
    path: "{{ whanos_root }}/jenkins/scripts"
    mode: "0750"
    recurse: yes

- name: Copy images
  copy:
    src: "{{ playbook_dir }}/../images/"
    dest: "{{ whanos_root }}/images/"
    owner: jenkins
    group: jenkins
    directory_mode: "0750"

- name: Copy kubeconfig file
  copy:
    src: "{{ local_kubeconfig_path }}"
    dest: "{{ kubeconfig_path }}"
    owner: jenkins
    group: jenkins
    mode: "0600"

- name: Read plugins list
  slurp:
    src: "{{ whanos_root }}/jenkins/plugins.txt"
  register: plugins_content

- name: Check if plugins need to be installed
  stat:
    path: "{{ jenkins_home }}/plugins/{{ item | regex_replace(':.*$','') }}"
  register: jenkins_plugins_check
  with_items: "{{ plugins_content.content | b64decode | split('\n') }}"
  notify: Install Jenkins plugins
  changed_when: not jenkins_plugins_check.stat.exists
  when: item != ""

- name: Configure Jenkins service
  template:
    src: jenkins.service.j2
    dest: /etc/systemd/system/jenkins.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Jenkins

- name: Ensure /etc/jenkins exists
  file:
    path: /etc/jenkins
    state: directory
    owner: root
    group: jenkins
    mode: "0750"

- name: Install Whanos Jenkins environment file
  template:
    src: whanos.env.j2
    dest: /etc/jenkins/whanos.env
    owner: root
    group: jenkins
    mode: "0640"
  notify: Restart Jenkins

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes
  notify: Restart Jenkins

- name: Flush handlers before first start (plugins / unit)
  meta: flush_handlers

- name: Start and enable Jenkins service
  systemd:
    name: jenkins
    state: started
    enabled: yes
    daemon_reload: yes
