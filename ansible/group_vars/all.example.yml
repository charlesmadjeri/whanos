# VPS Configuration (non-secret). Secrets come from repo-root .env via lookup('env').
# After Terraform: ansible/host_vars/whanos.yml is written automatically (overrides vps_ip here).
# Optional: make merge-tf-ansible also copies those keys into this file.

vps_ip: ""
# Leave unset for SSH-key auth. Never set to "" — Ansible treats that as password mode.
# vps_root_password: "only-if-you-must"

# Project-local SSH key for Ansible (generate under ansible/ssh/ — see docs)
# inventory_dir = ansible/ → ansible/ssh/whanos_vps
vps_ssh_private_key_file: "{{ inventory_dir }}/ssh/whanos_vps"

# Jenkins — password from .env (JENKINS_ADMIN_PASSWORD). URL is always the VPS
# (Compose-only JENKINS_URL=localhost must not leak into Ansible Casc).
jenkins_admin_password: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') }}"
jenkins_url: "http://{{ vps_ip }}"

# Optional TLS (prod). Manual certs *or* Let's Encrypt ACME:
#   jenkins_tls_acme_enabled: true
#   jenkins_tls_acme_email: you@example.com
#   jenkins_tls_server_name: jenkins.example.com   # DNS A → this VPS
jenkins_tls_enabled: false
jenkins_tls_acme_enabled: false
jenkins_tls_acme_email: ""
jenkins_tls_server_name: "{{ vps_ip }}"
jenkins_tls_cert_path: "" # e.g. /etc/letsencrypt/live/jenkins.example.com/fullchain.pem
jenkins_tls_key_path: ""  # e.g. /etc/letsencrypt/live/jenkins.example.com/privkey.pem

# Paths
jenkins_home: "/var/lib/jenkins"
whanos_root: "/opt/whanos"

# DigitalOcean block volume (optional; leave empty to skip)
# Small droplets use tmpfs /tmp (~half of RAM), which trips Jenkins' 1GiB free-space check.
# Terraform fills these via host_vars/whanos.yml for the $4 droplet path.
do_volume_device: "" # e.g. /dev/disk/by-id/scsi-0DO_Volume_whanos-dev-jenkins-tmp
do_volume_mount: "" # e.g. /mnt/whanos-dev-jenkins-tmp
jenkins_tmpdir: "{{ do_volume_mount }}/jenkins-tmp"

# Registry — from .env (REGISTRY_TOKEN defaults to DIGITALOCEAN_TOKEN)
registry_host: "{{ lookup('env', 'REGISTRY_HOST') | default('registry.digitalocean.com', true) }}"
registry_name: "{{ lookup('env', 'REGISTRY_NAME') | default('whanos', true) }}"
registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
registry_token: "{{ lookup('env', 'REGISTRY_TOKEN') | default(lookup('env', 'DIGITALOCEAN_TOKEN'), true) }}"

# Kubernetes Configuration
local_kubeconfig_path: "{{ playbook_dir }}/../kubeconfig.yaml"
kubeconfig_path: "{{ jenkins_home }}/kube/config"
