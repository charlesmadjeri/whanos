---
- name: Setup Whanos on Debian VPS
  hosts: whanos
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    # Refresh before any role apt update — a stale/wrong jenkins.list breaks every apt call.
    - name: Ensure apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    - name: Install current Jenkins repository signing key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
        force: true
    - name: Ensure Jenkins apt repository list
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/
  roles:
    - ufw
    - docker
    - jenkins
    - nginx
