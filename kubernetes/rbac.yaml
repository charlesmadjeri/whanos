apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: whanos-deployer
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whanos-deployer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: whanos-deployer
subjects:
- kind: ServiceAccount
  name: whanos-deployer
  namespace: default
roleRef:
  kind: ClusterRole
  name: whanos-deployer
  apiGroup: rbac.authorization.k8s.io 